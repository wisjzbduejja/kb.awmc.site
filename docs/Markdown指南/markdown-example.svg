<svg xmlns="http://www.w3.org/2000/svg" width="640" height="144" viewBox="0 0 640 144" role="img" aria-labelledby="title desc">
  <title id="title">Markdown 渲染流程</title>
  <desc id="desc">左侧的 Markdown 源码经过渲染，生成右侧的 HTML 页面。</desc>
  <rect width="640" height="144" fill="#111111"/>
  <g fill="#191919" stroke="#707070" stroke-width="1">
    <rect x="24" y="40" width="224" height="64" rx="0"/>
    <rect x="392" y="40" width="224" height="64" rx="0"/>
  </g>
  <path d="M272 72H368M358 62L368 72L358 82" fill="none" stroke="#f2f2f2" stroke-width="2"/>
  <g fill="#f2f2f2" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="20" text-anchor="middle">
    <text x="136" y="79">Markdown 源码</text>
    <text x="504" y="79">HTML 页面</text>
  </g>
  <text x="320" y="52" fill="#b3b3b3" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">渲染</text>
</svg>
